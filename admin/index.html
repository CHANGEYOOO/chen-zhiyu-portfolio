<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0908" />
    <title>作品管理 / Chen Zhiyu</title>
    <link rel="stylesheet" href="admin.css?v=0.1" />
    <script src="config.js" defer></script>
    <script type="module" src="admin.js?v=0.1"></script>
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-topbar">
        <a class="admin-mark" href="../">CHEN ZHIYU <span>/ WORKS ADMIN</span></a>
        <button class="text-button" type="button" data-signout hidden>退出登录</button>
      </header>

      <section class="admin-intro" aria-labelledby="admin-title">
        <p class="eyebrow">PRIVATE CONTENT ROOM</p>
        <h1 id="admin-title">作品管理</h1>
        <p>只管理前台作品下方显示的文字、封面、视频与项目图片。</p>
      </section>

      <section class="setup-card" data-setup hidden>
        <p class="eyebrow">FIRST-TIME SETUP</p>
        <h2>等待连接 Supabase</h2>
        <p>复制 <code>config.example.js</code> 为 <code>config.js</code>，填入项目 URL 和匿名 Key，然后刷新本页。</p>
      </section>

      <section class="login-card" data-login hidden>
        <p class="eyebrow">ADMIN LOGIN</p>
        <h2>进入作品管理</h2>
        <form data-login-form>
          <label>邮箱<input name="email" type="email" autocomplete="username" required /></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
          <button class="primary-button" type="submit">登录</button>
          <p class="form-feedback" data-login-feedback role="status"></p>
        </form>
      </section>

      <section class="workspace" data-workspace hidden>
        <div class="workspace-head">
          <div class="filters" role="tablist" aria-label="作品筛选">
            <button class="filter-button is-active" type="button" data-section-filter="all">全部</button>
            <button class="filter-button" type="button" data-section-filter="tvc">TVC</button>
            <button class="filter-button" type="button" data-section-filter="livestream">直播间</button>
          </div>
          <button class="primary-button" type="button" data-new-work>新增作品</button>
        </div>
        <p class="form-feedback" data-global-feedback role="status"></p>
        <div class="work-list" data-work-list></div>
      </section>

      <dialog class="editor" data-editor>
        <form method="dialog" data-editor-form>
          <div class="editor-head">
            <div><p class="eyebrow">WORK ENTRY</p><h2 data-editor-title>新增作品</h2></div>
            <button class="close-button" value="cancel" aria-label="关闭">×</button>
          </div>
          <input name="id" type="hidden" />
          <div class="form-grid">
            <label>栏目
              <select name="section" data-section-input><option value="tvc">TVC</option><option value="livestream">直播间</option></select>
            </label>
            <label>排序<input name="sort_order" type="number" min="0" step="1" value="0" required /></label>
            <label class="tvc-only">品牌名<input name="brand_name" type="text" /></label>
            <label>作品名称 / 直播名<input name="work_title" type="text" required /></label>
            <label>作品类型 / 类型<input name="work_type" type="text" required /></label>
            <label class="tvc-only">视频地址<input name="video_url" type="url" placeholder="https://…/作品.mp4" /></label>
            <label>封面地址<input name="poster_url" type="url" placeholder="上传后自动填入，或粘贴现有地址" required /></label>
            <label class="file-field">上传封面<input name="poster_file" type="file" accept="image/webp,image/jpeg,image/png" /></label>
          </div>
          <div class="livestream-only image-manager" hidden>
            <div class="field-heading"><span>项目图片</span><small>数量不设上限</small></div>
            <div class="image-list" data-image-list></div>
            <label class="file-field">添加项目图片<input name="image_files" type="file" accept="image/webp,image/jpeg,image/png" multiple /></label>
          </div>
          <div class="editor-actions">
            <select name="status"><option value="draft">保存为草稿</option><option value="published">发布到前台</option><option value="archived">归档</option></select>
            <button class="primary-button" type="submit">保存</button>
          </div>
          <p class="form-feedback" data-editor-feedback role="status"></p>
        </form>
      </dialog>
    </main>
  </body>
</html>
